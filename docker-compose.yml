services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rumo
      POSTGRES_PASSWORD: rumo
      POSTGRES_DB: rumo
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rumo -d rumo"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://rumo:rumo@db:5432/rumo
    command: sh -c "alembic upgrade head && uvicorn api.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://rumo:rumo@db:5432/rumo
    command: python -m worker.main
    depends_on:
      db:
        condition: service_healthy
