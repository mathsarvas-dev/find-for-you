services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rumo
      POSTGRES_PASSWORD: rumo
      POSTGRES_DB: rumo
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rumo -d rumo"]
      interval: 5s
      timeout: 5s
      retries: 10
