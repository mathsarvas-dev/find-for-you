services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rumo
      POSTGRES_PASSWORD: rumo
      POSTGRES_DB: rumo
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./scripts/db/create-test-db.sql:/docker-entrypoint-initdb.d/10-create-test-db.sql:ro
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rumo -d rumo"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://rumo:rumo@db:5432/rumo
    command: alembic upgrade head
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://rumo:rumo@db:5432/rumo
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      args:
        WITH_EMBEDDINGS: "1"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://rumo:rumo@db:5432/rumo
    command: python -m worker.main
    restart: unless-stopped
    volumes:
      - hf_cache:/root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  hf_cache:
